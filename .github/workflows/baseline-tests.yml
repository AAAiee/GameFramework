name: baseline-tests

on:
  push:
    branches: [Editor]
  pull_request:
  workflow_dispatch:

jobs:
  ui-catalog:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan Editor widget labels against the UI catalog
        shell: pwsh
        run: |
          $started = Get-Date
          & ./Tests/Windows/scan-ui-catalog.ps1
          $code = $LASTEXITCODE
          $seconds = ((Get-Date) - $started).TotalSeconds
          Write-Host ("scan-ui-catalog {0:N2} s" -f $seconds)
          if ($code -ne 0) { throw 'scan-ui-catalog failed' }
          if ($seconds -ge 5) { throw "scan-ui-catalog took $seconds s, limit 5 s" }

  unittests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v2
      - name: UnitTests Debug and Release
        shell: pwsh
        run: ./Tests/Windows/hosted-ci-probe.ps1 -Stage unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unittests-probe
          path: Binaries/hosted-ci-probe/

  layering-proof:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v2
      - name: Prove UnitTests covers the engine and ignores the editor layer
        shell: pwsh
        run: ./Tests/Windows/prove-layering.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layering-proof
          path: Binaries/layering-proof/
